
name: 'financial_twin'
version: '1.0.0'
config-version: 2

profile: 'financial_twin'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  financial_twin:
    # Config for all models
    materialized: view 
    bronze:
      materialized: view
    silver:
      materialized: table
    gold:
      materialized: table
